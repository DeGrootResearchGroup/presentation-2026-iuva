nt-size="16" fill="#52514e" font-weight="400" text-anchor="start">One particle = one row; several can share a mesh cell. Rows are re-sorted as particles move, so there is no particle ID</text><text x="1020" y="72" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" font-weight="700" text-anchor="start">Same idea as finite volume</text><path d="M1020 97.0 l6.0 6.0 l11.0 -12.0" stroke="#1f7a3f" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="1054" y="102" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" font-weight="400" text-anchor="start">Fields hold the state</text><path d="M1020 125.0 l6.0 6.0 l11.0 -12.0" stroke="#1f7a3f" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="1054" y="130" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" font-weight="400" text-anchor="start">Models: injection, forces, dispersion</text><path d="M1020 153.0 l6.0 6.0 l11.0 -12.0" stroke="#1f7a3f" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="1054" y="158" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" font-weight="400" text-anchor="start">Patches: rebound, stick, escape</text></svg>