 radiance every way</text><text x="372" y="178" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#6b3fa0" font-weight="700" text-anchor="start">Cosine power (n = 5)</text><text x="372" y="198" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">brighter along the normal</text><text x="290" y="300" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#52514e" font-weight="400" text-anchor="middle">IES file: measured profile of a real lamp (also depends on azimuth)</text><text x="290" y="322" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#52514e" font-weight="400" text-anchor="middle">The curve length in a direction is g(cos θ)</text><line x1="590" y1="20" x2="590" y2="320" stroke="#c9c6d1" stroke-width="1.5"/><text x="900" y="26" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#1a1a1a" font-weight="700" text-anchor="middle">Solid angle: how big a facet looks from x</text><polygon points="740,74 1090,74 930,134" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2.5"/><text x="910" y="62" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#2a78d6" font-weight="600" text-anchor="middle">lamp facet (one triangle)</text><line x1="910" y1="290" x2="740" y2="74" stroke="#8a8894" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="910" y1="290" x2="1090" y2="74" stroke="#8a8894" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="910" y1="290" x2="930" y2="134" stroke="#8a8894" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M810 290 A100 100 0 0 1 1010 290" stroke="#8a8894" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M848.2 211.4 A100 100 0 0 1 922.7 190.8 A100 100 0 0 1 974.0 213.2 Q910 224 848.2 211.4 Z" stroke="#6b3fa0" stroke-width="2.5" fill="#6b3fa066" stroke-linecap="round"/><line x1="910" y1="290" x2="848.2" y2="211.4" stroke="#6b3fa0" stroke-width="2" marker-end="url(#arrPo)"/><circle cx="848.1535975166514" cy="211.4186886093923" r="4" fill="#6b3fa0" stroke="none" stroke-width="0"/><text x="869.0767987583257" y="250.70934430469615" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b3fa0" font-weight="700" text-anchor="end" font-style="italic">a</text><line x1="910" y1="290" x2="974.0" y2="213.2" stroke="#6b3fa0" stroke-width="2" marker-end="url(#arrPo)"/><circle cx="974.018439966448" cy="213.1778720402624" r="4" fill="#6b3fa0" stroke="none" stroke-width="0"/><text x="952.009219983224" y="251.5889360201312" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b3fa0" font-weight="700" text-anchor="start" font-style="italic">b</text><line x1="910" y1="290" x2="922.7" y2="190.8" stroke="#6b3fa0" stroke-width="2" marker-end="url(#arrPo)"/><circle cx="922.7164315985366" cy="190.81183353141495" r="4" fill="#6b3fa0" stroke="none" stroke-width="0"/><text x="925.3582157992682" y="244.40591676570747" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6b3fa0" font-weight="700" text-anchor="start" font-style="italic">c</text><text x="726" y="68" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#2a78d6" font-weight="700" text-anchor="middle" font-style="italic">A</text><text x="1104" y="68" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#2a78d6" font-weight="700" text-anchor="middle" font-style="italic">B</text><text x="930" y="156" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#2a78d6" font-weight="700" text-anchor="middle" font-style="italic">C</text><circle cx="910" cy="290" r="8" fill="#1a1a1a" stroke="none" stroke-width="0"/><text x="910" y="318" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#1a1a1a" font-weight="700" text-anchor="middle"><tspan>x</tspan></text><text x="1022" y="292" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#8a8894" font-weight="400" text-anchor="start">sphere of radius</text><text x="1022" y="311" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#8a8894" font-weight="400" text-anchor="start">R = 1 around x</text><line x1="1024" y1="172" x2="968" y2="207" stroke="#6b3fa0" stroke-width="1.5"/><text x="1030" y="168" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#6b3fa0" font-weight="700" text-anchor="start"><tspan>Ω = area / R²</tspan></text><text x="1030" y="190" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#6b3fa0" font-weight="400" text-anchor="start">(R = 1, so Ω = area)</text><text x="630" y="214" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">a, b, c: unit vectors</text><text x="630" y="233" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">from x toward the</text><text x="630" y="252" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">corners A, B, C:</text><text x="630" y="271" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">a = (A − x)/|A − x|</text><text x="630" y="300" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Far away Ω ≈ A cosθ/r²;</text><text x="630" y="318" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">close up that fails, so</text><text x="630" y="336" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">aquaflux uses exact Ω</text></svg>