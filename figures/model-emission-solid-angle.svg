<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="342" viewBox="0 0 1180 342"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8894"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a3f"/></marker><marker id="arrPo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b3fa0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="290" y="26" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#1a1a1a" font-weight="700" text-anchor="middle">Emission profile: brightness by direction</text><line x1="190" y1="60" x2="390" y2="60" stroke="#2a78d6" stroke-width="7"/><text x="182" y="65" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#2a78d6" font-weight="600" text-anchor="end">lamp facet</text><line x1="290" y1="60" x2="290.0" y2="245.0" stroke="#8a8894" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrA)"/><text x="298" y="250" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e" font-weight="600" text-anchor="start"><tspan>n</tspan></text><path d="M235 60 A55 55 0 0 0 345 60 Z" stroke="#2a78d6" stroke-width="2.5" fill="#e8f1fb" stroke-linecap="round"/><path d="