<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="450" viewBox="0 0 1160 450"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8894"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a3f"/></marker><marker id="arrPo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b3fa0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="180" y="26" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" fill="#1a1a1a" font-weight="700" text-anchor="middle">Inputs</text><text x="590" y="26" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" fill="#1a1a1a" font-weight="700" text-anchor="middle">What the model does</text><text x="990" y="26" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" fill="#1a1a1a" font-weight="700" text-anchor="middle">Outputs</text><text x="10" y="60" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#52514e" font-weight="700" text-anchor="start">Geometry: fixed when the model is built</text><rect x="10" y="70" width="340" height="52" rx="10" fill="#eceaf1" stroke="#8a8894" stroke-width="2"/><text x="24" y="96" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Surface triangles (STL file):</text><text x="24" y="116" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">lamps, walls, sleeves</text><rect x="10" y="128" width="340" height="52" rx="10" fill="#eceaf1" stroke="#8a8894" stroke-width="2"/><text x="24" y="154" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Receiver points x</text><text x="24" y="174" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">(cell centres, probes)</text><rect x="10" y="186" width="340" height="36" rx="10" fill="#eceaf1" stroke="#8a8894" stroke-width="2"/><text x="24" y="212" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Shapes of the bodies in the way</text><text x="10" y="256" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start">Optics: supplied at every call</text><rect x="10" y="266" width="340" height="36" rx="10" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2"/><text x="24" y="292" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Emission M, profile g, point power P</text><rect x="10" y="308" width="340" height="36" rx="10" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2"/><text x="24" y="334" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Reflectance ρ</text><rect x="10" y="350" width="340" height="36" rx="10" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2"/><text x="24" y="376" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Absorption a (uniform or voxel grid)</text><rect x="10" y="392" width="340" height="36" rx="10" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2"/><text x="24" y="418" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Transmittance of the bodies in the way</text><rect x="420" y="58" width="340" height="108" rx="10" fill="#efe9f6" stroke="#6b3fa0" stroke-width="2"/><text x="434" y="84" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#4B2682" font-weight="700" text-anchor="start">1. Build once</text><text x="434" y="108" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Facet-to-facet geometry (N²)</text><text x="434" y="128" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Shadow masks: facet to facet,</text><text x="434" y="148" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">facet to receiver. Reused by every call</text><rect x="420" y="196" width="340" height="108" rx="10" fill="#efe9f6" stroke="#6b3fa0" stroke-width="2"/><text x="434" y="222" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#4B2682" font-weight="700" text-anchor="start">2. Solve for the radiosity B</text><text x="434" y="246" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">(I − diag ρ F) B = s</text><text x="434" y="266" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">by matrix-free GMRES,</text><text x="434" y="286" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">once per call</text><rect x="420" y="334" width="340" height="108" rx="10" fill="#efe9f6" stroke="#6b3fa0" stroke-width="2"/><text x="434" y="360" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#4B2682" font-weight="700" text-anchor="start">3. Gather the fluence rate G</text><text x="434" y="384" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">Emitted light + reflected light (B − M)</text><text x="434" y="404" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">× absorption T × visibility V,</text><text x="434" y="424" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">summed over the facets</text><line x1="590" y1="166" x2="590.0" y2="194.0" stroke="#6b3fa0" stroke-width="2.5" marker-end="url(#arrP)"/><line x1="590" y1="304" x2="590.0" y2="332.0" stroke="#6b3fa0" stroke-width="2.5" marker-end="url(#arrP)"/><line x1="358" y1="70" x2="358" y2="222" stroke="#8a8894" stroke-width="2.5"/><line x1="358" y1="266" x2="358" y2="428" stroke="#2a78d6" stroke-width="2.5"/><line x1="358" y1="146" x2="418.2" y2="113.0" stroke="#8a8894" stroke-width="2.5" marker-end="url(#arrP)"/><line x1="358" y1="347" x2="418.9" y2="251.7" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="358" y1="347" x2="418.3" y2="386.9" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="830" y="196" width="320" height="108" rx="10" fill="#ffffff" stroke="#1f7a3f" stroke-width="2"/><text x="844" y="222" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e" font-weight="400" text-anchor="start">B, H: radiosity and</text><text x="844" y="242" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e" font-weight="400" text-anchor="start">irradiance on every facet</text><rect x="830" y="334" width="320" height="108" rx="10" fill="#ffffff" stroke="#1f7a3f" stroke-width="2"/><text x="844" y="360" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e" font-weight="400" text-anchor="start">G(x): fluence rate at every</text><text x="844" y="380" font-family="'Source Sans Pro','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e" font-weight="400" text-anchor="start">receiver, in W/m²</text><line x1="760" y1="250" x2="828.0" y2="250.0" stroke="#1f7a3f" stroke-width="2.5" marker-end="url(#arrG)"/><line x1="760" y1="388" x2="828.0" y2="388.0" stroke="#1f7a3f" stroke-width="2.5" marker-end="url(#arrG)"/></svg>